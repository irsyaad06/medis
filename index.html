<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Medis Lapangan</title>
    <!-- Include CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-title">
            <h1>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 3H5c-1.1 0-1.99.9-1.99 2L3 19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8.5 11.5H9V16H7v-1.5H5.5v-2H7V11h2v1.5h1.5v2zM19 12h-6v-2h6v2zM19 8h-6V6h6v2z"/>
                </svg>
                Medis Kemping SD
            </h1>
            <p>Dashboard & Buku Saku Darurat</p>
        </div>
    </header>

    <div class="container">
        
        <!-- INVENTORY TAB -->
        <div id="tab-inventory" class="tab-content active">
            <h2>Inventaris Alat & Obat</h2>
            <div class="list-container">
                <div id="inventory-list">
                    <!-- Injected by JS -->
                </div>
            </div>
        </div>

        <!-- STUDENTS TAB -->
        <div id="tab-students" class="tab-content">
            <h2>Risiko Medis Siswa</h2>
            
            <div class="search-container">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="search-student" placeholder="Cari nama siswa atau kelas..." onkeyup="handleSearch()">
            </div>

            <div class="filters-wrapper">
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">Semua</button>
                    <button class="filter-btn" data-filter="suhu">Suhu Dingin/Asma</button>
                    <button class="filter-btn" data-filter="makanan">Alergi Makanan</button>
                    <button class="filter-btn" data-filter="fisik">Fisik/Lainnya</button>
                </div>
            </div>

            <div class="grid-container" id="students-list">
                <!-- Injected by JS -->
            </div>
        </div>

        <!-- SCHEDULE TAB -->
        <div id="tab-schedule" class="tab-content">
            <h2>Jadwal & Panduan Preventif</h2>
            <div class="card" style="padding: 0;">
                <div class="timeline" id="schedule-list">
                    <!-- Injected by JS -->
                </div>
            </div>
        </div>

        <!-- POCKET BOOK TAB -->
        <div id="tab-pocketbook" class="tab-content">
            <h2>Buku Saku Dosis Obat</h2>
            <div class="list-container">
                <div id="pocketbook-list">
                    <!-- Injected by JS -->
                </div>
            </div>
        </div>

    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('inventory', this)">
            <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
            Alat
        </button>
        <button class="nav-item" onclick="switchTab('students', this)">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            Siswa
        </button>
        <button class="nav-item" onclick="switchTab('schedule', this)">
            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            Jadwal
        </button>
        <button class="nav-item" onclick="switchTab('pocketbook', this)">
            <svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
            Buku Saku
        </button>
    </nav>

    <!-- GLASSMORPHISM MODAL -->
    <div class="modal-overlay" id="medical-modal">
        <div class="modal-content">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h3 id="modal-title">Judul Panduan</h3>
                <button class="btn-close" onclick="closeModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Injected by JS -->
            </div>
        </div>
    </div>

    <!-- Include JS -->
    <script src="script.js"></script>
</body>
</html>
